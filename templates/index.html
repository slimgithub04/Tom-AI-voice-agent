<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outbound Call Tool</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .call-container { background: #f5f5f5; padding: 2rem; border-radius: 8px; text-align: center; }
        button { background: #007bff; color: white; border: none; padding: 1rem 2rem; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #0056b3; }
        .message { margin-top: 1rem; padding: 1rem; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="call-container">
        <h2>Trigger Outbound Call</h2>
        <label for="phoneNumber">Numéro de téléphone (défaut: ***REMOVED***):</label>
        <input type="tel" id="phoneNumber" placeholder="+216XXXXXXXXX" value="***REMOVED***">
        <button id="callButton">Make Outbound Call</button>
        <div id="message" class="message"></div>
    </div>

    <script>
        const callButton = document.getElementById('callButton');
        const messageDiv = document.getElementById('message');

        callButton.addEventListener('click', async () => {
            callButton.disabled = true;
            messageDiv.style.display = 'none';

            try {
                const phoneNumber = document.getElementById('phoneNumber').value;
                const response = await fetch('/call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phoneNumber: phoneNumber }),
                });
                const data = await response.json();

                messageDiv.className = 'message success';
                messageDiv.textContent = data.message;
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Failed to initiate call';
            }

            messageDiv.style.display = 'block';
            callButton.disabled = false;
        });
    </script>
</body>
</html>
